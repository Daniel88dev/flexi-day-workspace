name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Formatting, JS lint and the Markdown relative-link check. This repo ships docs
  # and small Node tools, so "text" is as much of the product as the code.
  checks:
    name: Format, lint & links
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node and pnpm, install dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      # showreel/ has its own lockfile, and the install is what checks it against the
      # supply-chain policy in its pnpm-workspace.yaml.
      - name: Install showreel dependencies
        run: pnpm -C showreel install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Check relative links
        run: pnpm run check:links

  # The commit hook rewrites the git index and the cloud setup script provisions a container,
  # so the shell under tools/ gets linted properly.
  shell:
    name: Shell
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck ships preinstalled on the GitHub-hosted ubuntu images.
      - name: ShellCheck
        run: find tools -name "*.sh" -exec shellcheck {} +

  actions:
    name: Workflows
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned tarball + checksum rather than a third-party action or curl | bash.
      - name: Install actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint

      - name: actionlint
        run: ./actionlint -color
