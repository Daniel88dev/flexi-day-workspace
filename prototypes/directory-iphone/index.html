  (T-479, https://www.fenro-dashboard.com/tasks/T-479)?
  One file, fake data, state in memory. Open it in a browser, or serve the folder with
  `python3 -m http.server`. The bar under the phone switches viewer, plan, theme, language,

      }
      function tabBar(active) {
        const tb = (k, icon, label) => `<div class="tb ${active === k ? "on" : ""}" onclick="goRoot('${k}')"><i class="ph${active === k ? "-fill" : ""} ph-${icon}"></i>${label}</div>`;
        return `<div class="tabbar">${tb("dashboard", "squares-four", t("dashboard"))}${tb("requests", "calendar-blank", t("requests"))}<div class="tb"><div class="disc"><i class="ph-bold ph-play"></i></div></div>${tb("attendance", "timer", t("myAttendance"))}<div class="tb" onclick="S.sheet='more';render()"><i class="ph ph-list"></i>${t("more")}</div></div>`;
      }
      function stackHead(title, opts = {}) {
        const back = S.stack.length > 1 ? S.stack[S.stack.length - 2] : null;
        const backLabel = opts.backLabel ? `<span>${opts.backLabel}</span>` : "";
        return `<div class="stackhead"><button class="back" onclick="pop()"><i class="ph-bold ph-caret-left"></i>${backLabel}</button>${title ? `<div class="stitle">${title}</div>` : ""}${opts.trailing || ""}</div>`;
      }

      // ---------- screens ----------
      function scrDashboard(which) {
        const title = { dashboard: t("dashboard"), requests: t("requests"), attendance: t("myAttendance") }[which];
        return `<div class="screen"><div class="scroll" style="padding-top:8px">
          <div style="display:flex;justify-content:space-between;align-items:center"><h1 class="h1">${title}</h1><i class="ph ph-bell" style="font-size:22px;color:var(--muted)"></i></div>
          <div class="gap-s"></div>
          <div class="dash-card"><div class="skel" style="height:14px;width:40%"></div><div class="gap-s"></div><div class="skel" style="height:56px;border-radius:16px;animation:none"></div></div>
          <div class="gap-s"></div>
          <div class="dash-card"><div class="skel" style="height:14px;width:55%;animation:none"></div><div class="gap-s"></div><div class="skel" style="height:110px;border-radius:16px;animation:none"></div></div>
          <div class="gap-s"></div>
          <div style="text-align:center;color:var(--faint);font-size:13px;padding:20px">Existing ${title} screen, unchanged.<br/>Open <b>More</b> to reach the directory.</div>
        </div>${tabBar(which)}</div>`;
      }

      function moreSheet() {
        const v = viewer();
        const row = (icon, label, on, extra = "", hl = false) => `<div class="mrow ${hl ? "hl" : ""}" onclick="${on}"><i class="ph ph-${icon}" style="font-size:22px"></i><span style="flex:1">${label}</span>${extra}</div>`;
        let people = "";
        if (dirOn()) people = `<div class="mlabel">${t("people")}</div>${row("address-book", t("directory"), "push({r:'directory'})", lapsed() ? `<span class="pill w">${S.lang === "cs" ? "jen čtení" : "read only"}</span>` : "", true)}`;
        else if (S.upsell && isAdmin(v)) people = `<div class="mlabel">${t("people")}</div>${row("address-book", t("directory"), "push({r:'upsell'})", `<span class="pill w">${t("ent")}</span>`, true)}`;
        return `<div class="sheetwrap"><div class="scrimbg" onclick="S.sheet=null;render()"></div><div class="sheet"><div class="grab"></div>
          <div class="mlabel">${t("timeOff")}</div>${row("chart-bar", t("report"), "")}${row("users", t("groups"), "")}
          ${people}
          <div style="height:1px;background:var(--border);margin:8px 0"></div>
          ${row("gear", t("settings"), "")}
          <div class="mrow" style="color:var(--danger)" onclick="signOut()"><i class="ph ph-sign-out" style="font-size:22px"></i>${t("signOut")}</div>
          <div style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px">
            <div class="mrow" style="height:56px" onclick="${dirOn() ? `push({r:'person',id:'${v.id}'})` : ""}">${avatar(v, v, 36)}<div style="flex:1;min-width:0"><div style="color:var(--text);font-size:14.5px">${v.name}</div><div style="font-size:12.5px;color:var(--faint);font-weight:500">${dirOn() ? (S.lang === "cs" ? "Můj profil v adresáři" : "My directory profile") : v.email}</div></div>${dirOn() ? '<i class="ph ph-caret-right chev"></i>' : ""}</div>
          </div>
        </div></div>`;
      }

      function scrUpsell() {
        return `<div class="screen">${stackHead(t("directory"))}<div class="scroll"><div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:60px 16px">
          <div class="logo" style="background:var(--warm-soft);color:var(--warm)"><i class="ph-fill ph-address-book"></i></div>
          <div class="h1" style="font-size:22px">${t("upsellTitle")}</div><div style="color:var(--muted);line-height:21px">${t("upsellBody")}</div>
          <button class="btn sec" onclick="toast(t('openingWeb'))">${t("seePlans")} <i class="ph ph-arrow-up-right"></i></button></div></div></div>`;
      }

      function lapseBanner() {
        if (!lapsed()) return "";
        return `<div class="notice w"><i class="ph-fill ph-warning-circle"></i><div>${t("lapsed")}${isAdmin(viewer()) ? " " + t("lapsedAdmin") : ""}</div></div><div class="gap-s"></div>`;
      }

      function filtered() {
        const v = viewer();
        const q = S.q.trim().toLowerCase();
        let list = S.seg === "former" ? PEOPLE.filter((p) => p.ended) : PEOPLE.filter((p) => !p.ended && reads(v, p, "card"));
        list = list.filter((p) => !q || p.name.toLowerCase().includes(q) || p.card.title.toLowerCase().includes(q));
        if (S.f.dept) list = list.filter((p) => p.card.dept === S.f.dept);
        if (S.f.loc) list = list.filter((p) => p.card.loc === S.f.loc);
        if (S.f.type) list = list.filter((p) => p.type === S.f.type);
        return list.sort(sortName);
      }

      function scrDirectory() {
        const v = viewer();
        const formerOk = hrish(v);
        if (!formerOk) S.seg = "current";
        const segRow = formerOk ? `<div class="seg"><button class="${S.seg === "current" ? "on" : ""}" onclick="S.seg='current';render()">${t("current")}</button><button class="${S.seg === "former" ? "on" : ""}" onclick="S.seg='former';render()">${t("former")}</button></div><div class="gap-s"></div>` : "";
        const chip = (k, label, val, name) => `<span class="chip ${val ? "on" : ""}" onclick="S.sheet='filter:${k}';render()">${val ? name : label}<i class="ph-bold ph-caret-down" style="font-size:11px"></i></span>`;
        const typeName = S.f.type === "external" ? t("externals") : t("employees");
        const head = `<div style="padding-top:2px">
          <h1 class="h1">${t("directory")}</h1><div style="color:var(--muted);font-size:14px;margin:2px 0 12px">Acme s.r.o.</div>
          ${lapseBanner()}
          ${segRow}
          <div class="search"><i class="ph ph-magnifying-glass" style="font-size:18px"></i><input id="q" placeholder="${t("search")}" value="${S.q.replace(/"/g, "&quot;")}" oninput="S.q=this.value;renderKeep()"/>${S.q ? `<i class="ph-fill ph-x-circle" style="cursor:pointer" onclick="S.q='';render()"></i>` : ""}</div>
          <div class="chips">${chip("dept", t("dept"), S.f.dept, deptName(S.f.dept))}${chip("loc", t("loc"), S.f.loc, locName(S.f.loc))}${chip("type", t("type"), S.f.type, typeName)}</div>
        </div>`;
        let body;
        if (S.read === "loading" || S.retrying) body = skelList();
        else if (S.read === "error") body = errorBox();
        else {
          const list = filtered();
          if (!list.length) body = `<div style="text-align:center;padding:48px 16px;color:var(--muted)"><i class="ph ph-magnifying-glass" style="font-size:34px;color:var(--faint)"></i><div style="font-weight:600;color:var(--text);margin:8px 0 4px">${t("noMatch")}</div><button class="btn ghost" onclick="S.q='';S.f={dept:'',loc:'',type:''};render()">${t("clearFilters")}</button></div>`;
          else if (S.seg === "former") body = formerList(list);
          else body = `<div class="label" style="padding-top:14px"><span>${t("nPeople", list.length)}</span></div>` + (S.listV === "rows" ? rowsList(list) : cardsList(list));
        }
        return `<div class="screen">${stackHead("")}<div class="scroll" id="dirscroll">${head}${body}</div></div>`;
      }

      function rowsList(list) {
        const v = viewer();
        return `<div class="card">${list.map((r) => `<div class="row tap" onclick="push({r:'person',id:'${r.id}'})">${avatar(r, v, 40)}<div class="kv"><div class="v" style="font-size:15.5px">${r.name}</div><div class="k" style="font-size:13px;color:var(--muted)">${[r.card.title, deptName(r.card.dept)].filter(Boolean).join(" · ")}</div><div style="display:flex;gap:4px;margin-top:3px;flex-wrap:wrap">${markers(r, v)}</div></div><i class="ph ph-caret-right chev"></i></div>`).join("")}</div>`;
      }
      function cardsList(list) {
        const v = viewer();
        return `<div class="grid2">${list.map((r) => `<div class="pcard" onclick="push({r:'person',id:'${r.id}'})">${avatar(r, v, 64)}<div class="n">${r.name}</div><div class="s">${r.card.title}</div><div class="s" style="color:var(--faint)">${locName(r.card.loc)}</div><div class="ch">${markers(r, v, true)}</div></div>`).join("")}</div>`;
      }
      function formerList(list) {
        const v = viewer();
        return `<div class="label" style="padding-top:14px"><span>${t("nPeople", list.length)}</span><span class="sub">${S.lang === "cs" ? "podle data odchodu" : "by end date"}</span></div><div class="card">${list.sort((a, b) => (a.ended < b.ended ? 1 : -1)).map((r) => {
          const nr = nextRemoval(r);
          const chips = [r.hold ? `<span class="pill w"><i class="ph-fill ph-pause"></i>${t("hold")}</span>` : "", r.account === "deleted" ? `<span class="pill d">${t("accountDeleted")}</span>` : "", r.rejoinedAs ? `<span class="pill p">${t("rejoined")}</span>` : ""].join("");
          return `<div class="row tap" onclick="push({r:'person',id:'${r.id}'})">${avatar(r, v, 40)}<div class="kv"><div class="v">${r.name}</div><div class="k" style="color:var(--muted)">${r.card.title} · ${t("ended", fd(r.ended))}</div>${nr ? `<div class="k">${t("nextRemoval", t("sec_" + nr.s), fd(nr.due))}</div>` : ""}<div style="display:flex;gap:4px;margin-top:3px;flex-wrap:wrap">${chips}</div></div><i class="ph ph-caret-right chev"></i></div>`;
        }).join("")}</div>`;
      }
      function skelList() {
        const r = () => `<div class="row"><span class="skel" style="width:40px;height:40px;border-radius:50%"></span><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="skel" style="height:14px;width:50%"></div><div class="skel" style="height:11px;width:70%"></div></div></div>`;
        return `<div class="label" style="padding-top:14px"><span class="skel" style="height:10px;width:70px;display:inline-block"></span></div><div class="card">${r()}${r()}${r()}${r()}${r()}</div>`;
      }
      function errorBox() {
        return `<div class="gap-s"></div><div class="notice d"><i class="ph-fill ph-cloud-slash"></i><div>${t("unreachable")}</div></div><div style="padding:8px 4px"><button class="btn ghost" onclick="retryRead()">${t("retry")}</button></div>`;
      }

      // ---------- profile ----------
      const val = (k, v, opts = {}) => {
        if (!v && opts.hideEmpty) return "";
        const tap = v && opts.tap ? `onclick="S.sheet='${opts.tap}:${encodeURIComponent(v)}:${opts.sens ? 1 : 0}';render()"` : "";
        const cls = v ? (opts.tap || opts.nav ? "v link" : "v") : "v muted";
        const nav = opts.nav ? `onclick="push({r:'person',id:'${opts.nav}'})"` : "";
        const icon = v && opts.tap ? `<i class="ph ph-${opts.tap === "tel" ? "phone" : "envelope-simple"}" style="color:var(--primary);font-size:20px"></i>` : opts.nav ? '<i class="ph ph-caret-right chev"></i>' : "";
        return `<div class="row ${tap || nav ? "tap" : ""}" ${tap} ${nav}><div class="kv"><div class="k">${k}</div><div class="${cls}">${v || t("notSet")}</div></div>${icon}</div>`;
      };
      function sectionBlock(r, s, inner, opts = {}) {
        const v = viewer();
        const ri = removalInfo(r, s);
        const sub = ri ? `<span class="sub" style="color:${ri.k === "gone" ? "var(--danger)" : ri.k === "due" ? "var(--warm)" : "var(--faint)"}">${ri.k === "gone" ? (S.lang === "cs" ? "vymazáno" : "removed") : ri.k === "due" ? fd(ri.due) : ""}</span>` : "";
        const label = opts.noLabel ? "" : `<div class="label"><span>${opts.title || t("sec_" + s)}${sensitive(s) && v.id !== r.id ? ' <i class="ph-fill ph-lock-simple"></i>' : ""}</span>${sub}</div>`;
        let content;
        if (ri && ri.k === "gone") content = `<div class="card"><div class="row"><i class="ph ph-trash ic"></i><div class="kv"><div class="v muted" style="font-style:normal">${ri.text}</div></div></div></div>`;
        else if (sensitive(s) && v.id !== r.id) {
          const st = revealedState(r, s);
          if (st === "closed") content = `<div class="card"><div class="lockbox"><div class="t"><i class="ph-fill ph-lock-simple" style="color:var(--primary)"></i>${t("hiddenTitle")}</div><div class="s">${t("hiddenBody")}</div><button class="btn sec" onclick="show('${r.id}','${s}')"><i class="ph ph-eye"></i>${t("show")}</button></div></div>`;
          else if (st === "loading") content = `<div class="card"><div class="lockbox" style="flex-direction:row;align-items:center"><div class="spin"></div><span style="color:var(--muted)">${S.lang === "cs" ? "Načítání…" : "Loading…"}</span></div></div>`;
          else if (st === "error") content = `<div class="card"><div class="lockbox"><div class="t" style="color:var(--danger)"><i class="ph-fill ph-cloud-slash"></i>${t("showFailed")}</div><button class="btn sec" onclick="show('${r.id}','${s}')">${t("retry")}</button></div></div>`;
          else content = `<div class="card">${inner}</div><div class="logline"><i class="ph ph-eye"></i>${t("logged")}</div>`;
        } else content = `<div class="card">${inner}</div>`;
        const foot = ri && ri.k !== "gone" ? `<div class="foot">${ri.text}</div>` : "";
        return `${label}${content}${foot}<div class="gap"></div>`;
      }
      function overviewInner(r, v) {
        const rt = r.card.reportsTo ? P[r.card.reportsTo] : null;
        const card = [val(t("f_title"), r.card.title), val(t("f_dept"), deptName(r.card.dept)), val(t("f_loc"), locName(r.card.loc)), rt ? val(t("f_reportsTo"), rt.name, { nav: rt.id }) : val(t("f_reportsTo"), "")].join("");
        let out = sectionBlock(r, "card", card);
        if (reads(v, r, "workContact")) out += sectionBlock(r, "workContact", val(t("f_workEmail"), r.work.email, { tap: "mailto" }) + val(t("f_workPhone"), r.work.phone, { tap: "tel" }));
        return out;
      }
      function jobInner(r) {
        const j = r.job;
        const emp = r.type === "employee";
        return sectionBlock(r, "job", [val(t("f_legal"), j.legal, { hideEmpty: true }), val(t("f_number"), j.number), val(t("f_start"), fd(j.start)), emp ? val(t("f_probation"), fd(j.probation)) : "", val(t("f_leaving"), fd(j.leaving)), emp ? val(t("f_contract"), j.contract ? t("ct_" + j.contract) : "") : "", emp ? val(t("f_wt"), j.wt ? t("wt_" + j.wt) : "") : ""].join(""));
      }
      function contactInner(r) {
        const c = r.contact;
        const ec = c.ec.map((e, i) => (e.name ? `<div class="row tap" onclick="S.sheet='tel:${encodeURIComponent(e.phone)}:1';render()"><div class="kv"><div class="k">${t("f_ec", i + 1)}</div><div class="v">${e.name}</div><div class="v link" style="font-size:14.5px">${e.phone}</div></div><i class="ph ph-phone" style="color:var(--primary);font-size:20px"></i></div>` : i === 0 ? val(t("f_ec", 1), "") : "")).join("");
        return sectionBlock(r, "contact", val(t("f_pphone"), c.phone, { tap: "tel", sens: true }) + val(t("f_pemail"), c.email, { tap: "mailto", sens: true }) + ec);
      }
      function personalInner(r) {
        const p = r.personal;
        const addr = p.a1 ? [p.a1, p.a2, `${p.postal} ${p.city}`, p.region, COUNTRY[p.country] ? COUNTRY[p.country][S.lang === "cs" ? 1 : 0] : ""].filter((x) => x && x.trim()).join("<br/>") : "";
        return sectionBlock(r, "personal", val(t("f_address"), addr) + val(t("f_dob"), fd(p.dob)));
      }
      function recordInner(r, v) {
        const rows = [];
        rows.push(val(t("f_type"), r.type === "external" ? t("external") : t("employee")));
        if (reads(v, r, "job")) rows.push(val(t("f_spell"), `${fd(r.start)} – ${r.ended ? fd(r.ended) : S.lang === "cs" ? "dosud" : "now"}`));
        if (hrish(v) || v.id === r.id) {
          const acc = { bound: t("bound"), none: t("noAccount"), invited: t("inviteSent"), deleted: t("accountDeleted") }[r.account];
          rows.push(val(t("f_account"), acc));
          if (r.account !== "deleted" && r.email) rows.push(val(t("f_signIn"), r.email));
          rows.push(val(t("f_roles"), r.roles.length ? r.roles.map((x) => (x === "hr" ? "HR" : S.lang === "cs" ? "Vedení" : "Leadership")).join(", ") : t("none")));
        }
        let out = `<div class="label"><span>${t("tab_record")}</span></div><div class="card">${rows.join("")}</div><div class="gap"></div>`;
        if (r.ended) {
          const secs = ["card", "photo", "workContact", "job", "contact", "personal"].filter((s) => !(s === "personal" && r.type === "external"));
          out += `<div class="label"><span>${t("retention")}</span></div><div class="card">${r.hold ? `<div class="row"><i class="ph-fill ph-pause-circle" style="color:var(--warm);font-size:20px"></i><div class="kv"><div class="v">${t("hold")}</div><div class="k">${t("holdBy", r.hold.by, fd(r.hold.at))}</div></div></div>` : ""}${secs.map((s) => { const ri = removalInfo(r, s); return `<div class="row"><div class="kv"><div class="k">${t("sec_" + s)}</div><div class="v" style="font-weight:500;font-size:14.5px;color:${ri.k === "gone" ? "var(--danger)" : ri.k === "due" ? "var(--warm)" : "var(--text)"}">${ri.text}</div></div></div>`; }).join("")}</div><div class="foot">${S.lang === "cs" ? "Doby uchování a pozastavení se nastavují na webu." : "Retention periods and holds are set on the web."}</div><div class="gap"></div>`;
        }
        return out;
      }
      function tabsFor(r, v) {
        const tabs = ["overview"];
        if (reads(v, r, "job")) tabs.push("job");
        if (reads(v, r, "contact")) tabs.push("contact");
        if (level(v, r, "personal") !== "na" && reads(v, r, "personal")) tabs.push("personal");
        if (reads(v, r, "job") || hrish(v) || v.id === r.id) tabs.push("record");
        return tabs;
      }
      function scrPerson(id) {
        const r = P[id], v = viewer();
        if (S.read === "loading" || S.retrying) return `<div class="screen">${stackHead("", { backLabel: t("directory") })}<div class="scroll"><span class="skel" style="display:block;width:80px;height:80px;border-radius:50%"></span><div class="gap-s"></div><div class="skel" style="height:26px;width:60%"></div><div class="gap-s"></div><div class="skel" style="height:14px;width:40%"></div><div class="gap"></div><div class="card"><div class="row"><div class="skel" style="height:14px;width:70%"></div></div><div class="row"><div class="skel" style="height:14px;width:50%"></div></div></div></div></div>`;
        if (S.read === "error") return `<div class="screen">${stackHead("", { backLabel: t("directory") })}<div class="scroll">${errorBox()}</div></div>`;
        const tabs = tabsFor(r, v);
        if (!tabs.includes(S.ptab)) S.ptab = "overview";
        const self = v.id === r.id;
        const canWC = reads(v, r, "workContact") && !(r.ended && r.removed.workContact);
        const phone = canWC && r.work.phone, mail = canWC && r.work.email;
        const qa = canWC && !r.ended ? `<div class="qa"><button ${phone ? `onclick="S.sheet='tel:${encodeURIComponent(r.work.phone)}:0';render()"` : "disabled"}><i class="ph-fill ph-phone"></i>${t("call")}</button><button ${phone ? `onclick="S.sheet='sms:${encodeURIComponent(r.work.phone)}:0';render()"` : "disabled"}><i class="ph-fill ph-chat-circle"></i>${t("message")}</button><button ${mail ? `onclick="S.sheet='mailto:${encodeURIComponent(r.work.email)}:0';render()"` : "disabled"}><i class="ph-fill ph-envelope-simple"></i>${t("email")}</button></div><div class="gap"></div>` : "";
        const header = `<div style="display:flex;flex-direction:column;gap:12px;padding:4px 4px 0">
          <div onclick="${avatarKind(r, v) === "photo" ? `S.sheet='photo:${r.id}';render()` : ""}" style="cursor:pointer;align-self:flex-start">${avatar(r, v, 84)}</div>
          <div><h1 class="h1">${r.name}</h1><div style="color:var(--muted);font-size:15px;margin-top:2px">${[r.card.title, deptName(r.card.dept)].filter(Boolean).join(" · ")}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${markers(r, v)}${r.ended ? `<span class="pill n">${t("formerSince", fd(r.ended))}</span>` : ""}${r.hold ? `<span class="pill w"><i class="ph-fill ph-pause"></i>${t("hold")}</span>` : ""}</div></div></div><div class="gap"></div>`;
        const selfHint = self ? `<div class="notice p"><i class="ph-fill ph-pencil-simple"></i><div style="flex:1">${lapsed() ? t("selfHintLapsed") : t("selfHint")}<div><button class="btn ghost" style="padding:0;height:30px" onclick="toast(t('openingWeb'))">${t("openWeb")} <i class="ph ph-arrow-up-right"></i></button></div></div></div><div class="gap"></div>` : "";
        const lb = lapsed() ? lapseBanner() + '<div class="gap-s"></div>' : "";
        let body = "";
        const blocks = { overview: () => overviewInner(r, v), job: () => jobInner(r), contact: () => contactInner(r), personal: () => personalInner(r), record: () => recordInner(r, v) };
        if (S.profV === "tabs") {
          const icon = (k) => (sensitive(k) && !self ? '<i class="ph-fill ph-lock-simple"></i>' : "");
          const tabRow = tabs.length > 1 ? `<div class="tabs">${tabs.map((k) => `<button class="${S.ptab === k ? "on" : ""}" onclick="S.ptab='${k}';render()">${icon(k)}${t("tab_" + k)}</button>`).join("")}</div><div class="gap-s"></div><div style="height:8px"></div>` : "";
          body = tabRow + blocks[S.ptab]();
        } else body = tabs.map((k) => blocks[k]()).join("");
        return `<div class="screen">${stackHead("", { backLabel: S.stack.length > 2 && S.stack[S.stack.length - 2].r === "person" ? P[S.stack[S.stack.length - 2].id].name.split(" ")[0] : t("directory") })}<div class="scroll">${header}${lb}${selfHint}${qa}${body}</div></div>`;
      }

      // ---------- sheets ----------
      function filterSheet(k) {
        const opts = k === "dept" ? Object.keys(DEPTS).filter((d) => PEOPLE.some((p) => !p.ended && p.card.dept === d)).map((d) => [d, deptName(d)]) : k === "loc" ? Object.keys(LOCS).map((l) => [l, locName(l)]) : [["employee", t("employees")], ["external", t("externals")]];
        const cur = S.f[k];
        const row = (id, label) => `<div class="mrow" style="color:var(--text)" onclick="S.f.${k}='${id}';S.sheet=null;render()"><span style="flex:1">${label}</span>${cur === id ? '<i class="ph-bold ph-check" style="color:var(--primary)"></i>' : ""}</div>`;
        return `<div class="sheetwrap"><div class="scrimbg" onclick="S.sheet=null;render()"></div><div class="sheet"><div class="grab"></div><div class="mlabel">${t(k)}</div>${row("", t("any"))}${opts.map(([id, l]) => row(id, l)).join("")}</div></div>`;
      }
      function actionSheet(kind, value, sens) {
        const v = decodeURIComponent(value);
        const main = kind === "tel" ? `${t("call")} ${v}` : kind === "sms" ? `${t("message")} ${v}` : `${t("email")} ${v}`;
        const msg = kind === "mailto" ? t("mailing", v) : t("calling", v);
        return `<div class="sheetwrap"><div class="scrimbg" onclick="S.sheet=null;render()"></div><div class="actsheet"><div class="grp"><div class="ttl">${v}</div><button onclick="S.sheet=null;toast('${msg.replace(/'/g, "\\'")}')">${main}</button>${sens === "1" ? "" : `<button onclick="S.sheet=null;toast(t('copied'))">${t("copy")}</button>`}</div><div class="grp"><button class="cancel" onclick="S.sheet=null;render()">${t("cancel")}</button></div></div></div>`;
      }
      function photoViewer(id) {
        const r = P[id];
        return `<div class="viewer"><div style="height:54px"></div><div style="display:flex;justify-content:space-between;padding:8px 16px;color:#fff"><button class="back" style="color:#fff" onclick="S.sheet=null;render()"><i class="ph-bold ph-x"></i></button><span style="font-weight:600">${r.name}</span><span style="width:30px"></span></div><div style="flex:1;display:flex;align-items:center;justify-content:center"><div style="width:360px;height:360px;background:linear-gradient(160deg, oklch(0.8 0.09 ${r.photo}), oklch(0.5 0.12 ${r.photo + 40}))">${SIL(0.8)}</div></div><div style="color:#aaa;font-size:12px;text-align:center;padding:0 24px 60px">Full-size signed link, about an hour. iOS's URL cache may keep it for that hour.</div></div>`;
      }

      // ---------- side panel: notes and state ----------
      const NOTES = {
        dashboard: ["The tab bar keeps its five slots (Dashboard, Requests, clock, My attendance, More). The directory goes behind More, in a new People section, the same name as the web's sidebar section.", "Free and Pro: no People section at all, unless the upsell switch in the bar is on and the viewer is owner or org admin."],
        directory: ["Pushed over the tab bar like Groups or Settings, with its own back button.", "Live read every time it opens, and again on pull to refresh and on foreground. Nothing goes to the local store.", "Search covers name and job title. Filters: department, location, type. Same as the web.", "Current / Former only for Owner, Org admin and HR.", "Markers: everyone sees External. No account, Invite sent and Account deleted only for Owner, Org admin and HR.", "No leave or attendance status."],
        person: ["Header holds the photo (Profile photo, then Account picture, then initials), name, title and markers. Tap a photo for the full size.", "Call / Message / Email buttons appear only when Work contact is readable.", "Sections the viewer can't read are absent. With only Overview left, the tab row disappears.", "Contact and Personal start closed for anyone but the person. Show fetches that one section live and writes one read-log row. Leaving the person (back, or tapping Reports to) closes them.", "Opened values live only in component memory: no query cache, no expo-sqlite. The app-switcher snapshot is covered while one is open.", "Reports to opens that person's profile. Read only. No edit controls anywhere."],
        upsell: ["Only shown with the upsell switch on, for owner and org admins on Free or Pro. The phone has no billing screens, so the button opens the web."],
      };
      function side() {
        const v = viewer();
        const fr = curFrame();
        const scr = S.signedOut ? "signed out" : fr.r;
        const notes = NOTES[fr.r] || NOTES.dashboard;
        let lv = "";
        if (fr.r === "person") {
          const r = P[fr.id];
          lv = `<div class="panel"><h3>Viewer → ${r.name}</h3><div>Audiences: <b>${[...auds(v, r)].join(", ") || "none"}</b></div><table>${["card", "photo", "workContact", "job", "contact", "personal"].map((s) => { const l = level(v, r, s); const shown = l === "na" ? "n/a (external)" : l; const mem = sensitive(s) ? (revealedState(r, s) === "open" && v.id !== r.id ? " · in memory" : v.id === r.id ? " · own, not logged" : "") : ""; return `<tr><td>${s}</td><td class="lv-${l}">${shown}</td><td>${mem}</td></tr>`; }).join("")}</table><div style="margin-top:6px;color:#8a7a40">The API returns only readable sections. The phone has nothing to hide itself.</div></div>`;
        }
        const log = `<div class="panel"><h3>Read-log rows written this session</h3>${S.log.length ? `<ul>${S.log.slice(0, 6).map((l) => `<li>${l.at} · ${l.reader} read ${l.person} · ${l.sec} (as ${l.via})</li>`).join("")}</ul>` : "<div>None yet. Only Show writes one; opening a profile writes none.</div>"}</div>`;
        return `<div class="panel"><h3>Prototype · T-479</h3><div>Screen: <b>${scr}</b> · Viewer: <b>${VIEWER_LABEL[S.role]}</b> · Plan: <b>${S.plan}</b></div><ul>${notes.map((n) => `<li>${n}</li>`).join("")}</ul></div>${lv}${log}
        <div class="panel"><h3>Simulate</h3><div style="display:flex;gap:6px;flex-wrap:wrap"><button onclick="S.bg=!S.bg;render()">${S.bg ? "Back to the app" : "App to background"}</button><button onclick="killApp()">Close the app</button><button onclick="S.signedOut=false;S.stack=[{r:'dashboard'}];render()">Reset</button></div><div style="margin-top:6px">Jump: <a href="#" onclick="jump('eva');return false">Eva</a> · <a href="#" onclick="jump('karel');return false">Karel (deleted)</a> · <a href="#" onclick="jump('petra');return false">Petra (no account)</a> · <a href="#" onclick="jump('ondrej');return false">Ondřej (former)</a> · <a href="#" onclick="jump('veronika');return false">Veronika (purged)</a> · <a href="#" onclick="jump('filip');return false">Filip (hold)</a> · <a href="#" onclick="jump(viewer().id);return false">Me</a></div></div>`;
      }
      function jump(id) { S.stack.forEach(leavePerson); S.signedOut = false; S.stack = [{ r: "dashboard" }, { r: "directory" }, { r: "person", id }]; S.ptab = "overview"; S.sheet = null; render(); }

      // ---------- control bar ----------
      function bar() {
        const g = (label, key, opts) => `<div class="g"><span>${label}</span>${opts.map(([v, l]) => `<button class="${S[key] === v ? "on" : ""}" onclick="S['${key}']=${typeof v === "boolean" ? v : `'${v}'`};S.revealed={};render()">${l}</button>`).join("")}</div>`;
        return `<div class="g"><span>Viewer</span><select onchange="S.role=this.value;S.revealed={};S.seg='current';render()">${Object.keys(VIEWERS).map((k) => `<option value="${k}" ${S.role === k ? "selected" : ""}>${VIEWER_LABEL[k]}</option>`).join("")}</select></div>
          ${g("Plan", "plan", [["ent", "Enterprise"], ["lapsed", "Lapsed"], ["none", "Free/Pro"]])}
          ${g("Upsell", "upsell", [[false, "off"], [true, "on"]])}
          ${g("Theme", "theme", [["light", "Light"], ["dark", "Dark"]])}
          ${g("Lang", "lang", [["en", "EN"], ["cs", "CS"]])}
          ${g("Read", "read", [["live", "Live"], ["loading", "Loading"], ["error", "Offline"], ["slow", "Slow Show"], ["showfail", "Show fails"]])}
          ${g("List", "listV", [["rows", "Rows"], ["cards", "Cards"]])}
          ${g("Profile", "profV", [["tabs", "Tabs"], ["scroll", "One scroll"]])}`;
      }

      // ---------- render ----------
      function render(keepFocus) {
        const ph = document.getElementById("phone");
        ph.className = "phone" + (S.theme === "dark" ? " dark" : "");
        document.body.className = S.theme === "dark" ? "darkpage" : "";
        const fr = curFrame();
        let screen;
        if (S.signedOut) screen = `<div class="screen" style="align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 32px"><div class="logo">F</div><div class="h1" style="font-size:24px">Flexi Day</div><div style="color:var(--muted)">${S.lang === "cs" ? "Byli jste odhlášeni. Vše z adresáře, co telefon držel v paměti, je pryč." : "You're signed out. Whatever the phone held of the directory in memory is gone."}</div></div>`;
        else if (fr.r === "directory") screen = scrDirectory();
        else if (fr.r === "person") screen = scrPerson(fr.id);
        else if (fr.r === "upsell") screen = scrUpsell();
        else screen = scrDashboard(fr.r);
        let sheet = "";
        if (S.sheet === "more") sheet = moreSheet();
        else if (S.sheet && S.sheet.startsWith("filter:")) sheet = filterSheet(S.sheet.slice(7));
        else if (S.sheet && S.sheet.startsWith("photo:")) sheet = photoViewer(S.sheet.slice(6));
        else if (S.sheet) { const [k, v, s] = S.sheet.split(":"); sheet = actionSheet(k, v, s); }
        const anyOpen = Object.values(S.revealed).includes("open");
        const priv = S.bg ? `<div class="privacy"><div class="logo">F</div><div style="color:var(--muted);font-size:13px;max-width:240px;text-align:center">${anyOpen ? "App-switcher snapshot is covered: a Contact or Personal section is open." : "Backgrounded. Nothing sensitive open, so the snapshot shows the screen as is (shown covered here only to mark the state)."}</div></div>` : "";
        const tst = S.toast ? `<div class="toast">${S.toast}</div>` : "";
        const sc = document.getElementById("dirscroll");
        const scrollTop = sc ? sc.scrollTop : 0;
        ph.innerHTML = statusBar() + screen + sheet + priv + tst + `<div class="homebar"></div>`;
        if (keepFocus) { const q = document.getElementById("q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } const sc2 = document.getElementById("dirscroll"); if (sc2) sc2.scrollTop = scrollTop; }
        document.getElementById("side").innerHTML = side();
        document.getElementById("bar").innerHTML = bar();
      }
      const renderKeep = () => render(true);

      // ---------- hash: #role=hr&plan=ent&theme=dark&lang=cs&go=person/eva&tab=contact&show=contact&sheet=more&seg=former ----------
      (function fromHash() {
        const p = new URLSearchParams(location.hash.slice(1));
        for (const k of ["role", "plan", "theme", "lang", "read", "listV", "profV", "seg", "q"]) if (p.get(k)) S[k] = p.get(k);
        if (p.get("upsell") === "1") S.upsell = true;
        for (const k of ["dept", "loc", "type"]) if (p.get(k)) S.f[k] = p.get(k);
        const go = p.get("go");
        if (go === "directory") S.stack = [{ r: "dashboard" }, { r: "directory" }];
        else if (go === "upsell") S.stack = [{ r: "dashboard" }, { r: "upsell" }];
        else if (go && go.startsWith("person/")) S.stack = [{ r: "dashboard" }, { r: "directory" }, { r: "person", id: go.slice(7) }];
        if (p.get("tab")) S.ptab = p.get("tab");
        if (p.get("sheet")) S.sheet = p.get("sheet");
        if (p.get("bg") === "1") S.bg = true;
        render();
        const ptab = p.get("tab");
        if (ptab) S.ptab = ptab;
        const sh = p.get("show");
        if (sh && go && go.startsWith("person/")) { const id = go.slice(7); for (const s of sh.split(",")) { S.revealed[id + ":" + s] = "open"; S.log.unshift({ reader: viewer().name, person: P[id].name, sec: t("sec_" + s), via: grantedBy(viewer(), P[id], s), at: "09:41" }); } }
        render();
      })();
    </script>
  </body>
</html>
