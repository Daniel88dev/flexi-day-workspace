<!doctype html>
<!--
  PROTOTYPE, throw away. T-478 "Design the directory and profile web pages".
  One self-contained file: fake data, state in memory, no backend.
  Question it answers: how the directory, profile, edit form, settings and dialogs
  look and behave on the web, and how the permission table changes them per viewer.
  Pages are hash routes (#/directory, #/person/eva, ...). The dark bar at the
  bottom is the prototype's own control: viewer, plan, layout variant, annotations.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PROTOTYPE · Directory web pages (T-478)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent-h: 285;
        --accent-c: 0.165;
        --bg: oklch(0.985 0.008 78);
        --surface: oklch(0.998 0.004 80);
        --surface-2: oklch(0.972 0.009 78);
        --border: oklch(0.915 0.01 80);
        --border-strong: oklch(0.86 0.012 80);
        --text: oklch(0.26 0.018 290);
        --muted: oklch(0.52 0.014 288);
        --faint: oklch(0.66 0.012 288);
        --primary: oklch(0.55 var(--accent-c) var(--accent-h));
        --primary-strong: oklch(0.48 var(--accent-c) var(--accent-h));
        --primary-soft: oklch(0.55 var(--accent-c) var(--accent-h) / 0.1);
        --warm: oklch(0.6 0.14 42);
        --warm-soft: oklch(0.66 0.14 42 / 0.12);
        --danger: oklch(0.58 0.18 25);
        --danger-soft: oklch(0.58 0.18 25 / 0.1);
        --ok: oklch(0.52 0.13 155);
        --ok-soft: oklch(0.58 0.13 155 / 0.14);
        --review: oklch(0.5 0.13 240);
        --review-soft: oklch(0.55 0.13 240 / 0.12);
        --shadow: 0 8px 24px -10px oklch(0.3 0.03 288 / 0.18), 0 2px 6px -2px oklch(0.3 0.03 288 / 0.1);
        --shadow-lg: 0 30px 60px -22px oklch(0.3 0.04 288 / 0.38);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1, h2, h3 { font-family: "Bricolage Grotesque", "Hanken Grotesk", sans-serif; margin: 0; }
      h1 { font-size: 24px; font-weight: 700; }
      h2 { font-size: 16px; font-weight: 600; }
      h3 { font-size: 16px; font-weight: 600; }
      a { color: var(--primary-strong); text-decoration: none; cursor: pointer; }
      a:hover { text-decoration: underline; }
      .ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; vertical-align: -3px; }
      .muted { color: var(--muted); }
      .faint { color: var(--faint); }
      .small { font-size: 12.5px; }
      .row { display: flex; align-items: center; gap: 8px; }
      .wrap { flex-wrap: wrap; }
      .grow { flex: 1; }
      .stack > * + * { margin-top: 16px; }
      .stack-s > * + * { margin-top: 8px; }

      /* shell */
      .shell { display: flex; min-height: 100vh; }
      .side { width: 248px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
      .logo { display: flex; align-items: center; gap: 8px; padding: 16px 14px 6px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 18px; }
      .logo i { width: 25px; height: 25px; border-radius: 8px; background: linear-gradient(140deg, var(--primary), oklch(0.66 0.14 42)); display: inline-block; }
      .navsec { padding: 12px 10px 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
      .nav { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; margin: 1px 6px; border-radius: 10px; font-weight: 600; color: var(--muted); cursor: pointer; }
      .nav:hover { background: var(--surface-2); color: var(--text); }
      .nav.on { background: var(--primary-soft); color: var(--primary-strong); }
      .nav .tagx { margin-left: auto; }
      .nav.dead { cursor: default; opacity: 0.55; }
      .side-foot { margin-top: auto; border-top: 1px solid var(--border); padding: 8px 4px 12px; }
      .me { display: flex; gap: 10px; align-items: center; padding: 8px 10px 0; }
      .main { flex: 1; min-width: 0; padding-bottom: 120px; }
      .top { position: sticky; top: 0; z-index: 20; height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 24px; border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--bg) 82%, transparent); backdrop-filter: blur(14px); }
      .crumb { font-weight: 600; font-size: 15px; }
      .crumb span { color: var(--muted); }
      .content { max-width: 1340px; margin: 0 auto; padding: 32px 28px; }
      .lang { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 999px; overflow: hidden; }
      .lang button { border: 0; background: transparent; padding: 5px 10px; font: inherit; font-weight: 700; font-size: 12px; cursor: pointer; color: var(--muted); }
      .lang button.on { background: var(--primary-soft); color: var(--primary-strong); }

      /* atoms */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid transparent; background: var(--primary); color: white; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
      .btn:hover { filter: brightness(1.06); }
      .btn.sm { height: 30px; padding: 0 11px; font-size: 13px; }
      .btn.xs { height: 24px; padding: 0 9px; font-size: 12px; }
      .btn.out { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
      .btn.out:hover { background: var(--surface-2); filter: none; }
      .btn.ghost { background: transparent; color: var(--text); }
      .btn.ghost:hover { background: var(--surface-2); filter: none; }
      .btn.danger { background: var(--danger-soft); color: var(--danger); }
      .btn:disabled, .btn.disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
      .card { background: var(--surface); border-radius: 18px; box-shadow: 0 0 0 1px oklch(0.26 0.018 290 / 0.08); padding: 20px 22px; }
      .card.tight { padding: 14px 16px; }
      .card-h { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
      .chip.p { background: var(--primary-soft); color: var(--primary-strong); }
      .chip.ok { background: var(--ok-soft); color: var(--ok); }
      .chip.warm { background: var(--warm-soft); color: var(--warm); }
      .chip.danger { background: var(--danger-soft); color: var(--danger); }
      .chip.rev { background: var(--review-soft); color: var(--review); }
      .chip.line { background: transparent; box-shadow: inset 0 0 0 1px var(--border-strong); }
      input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; height: 36px; padding: 0 10px; min-width: 0; }
      textarea { height: auto; padding: 8px 10px; width: 100%; }
      input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); color: var(--muted); }
      input:focus, select:focus, textarea:focus { outline: 2px solid oklch(0.55 0.165 285 / 0.4); outline-offset: 0; }
      label.f { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
      .field { display: flex; flex-direction: column; min-width: 0; }
      .field input, .field select { width: 100%; }
      .fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
      .fgrid .full { grid-column: 1 / -1; }
      .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
      .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 20px 0; }
      .tab { padding: 9px 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
      .tab.on { color: var(--primary-strong); border-color: var(--primary); }
      .tab .n { font-size: 11px; background: var(--surface-2); border-radius: 999px; padding: 1px 7px; color: var(--muted); }
      table.t { width: 100%; border-collapse: collapse; }
      table.t th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
      table.t td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
      table.t tr.click:hover td { background: var(--surface-2); cursor: pointer; }
      .banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--warm-soft); color: oklch(0.4 0.1 42); margin-bottom: 16px; }
      .banner.p { background: var(--primary-soft); color: var(--primary-strong); }
      .banner.rev { background: var(--review-soft); color: var(--review); }
      .banner .btn { margin-left: auto; }
      dl.fl { margin: 0; display: grid; grid-template-columns: 180px 1fr; gap: 0; }
      dl.fl dt, dl.fl dd { margin: 0; padding: 7px 0; border-bottom: 1px dashed var(--border); }
      dl.fl dt { color: var(--muted); }
      dl.fl dt:nth-last-child(2), dl.fl dd:last-child { border-bottom: 0; }

      /* avatar */
      .av { position: relative; display: inline-grid; place-items: center; border-radius: 999px; font-weight: 700; flex-shrink: 0; overflow: visible; }
      .av > svg { border-radius: 999px; }
      .av .src { position: absolute; right: -4px; bottom: -4px; font-size: 9px; line-height: 1; padding: 2px 4px; border-radius: 6px; background: oklch(0.2 0.02 290); color: white; font-weight: 700; letter-spacing: 0.03em; }

      /* directory */
      .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
      .filters input[type="search"] { width: 260px; }
      .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
      .pcard { background: var(--surface); border-radius: 18px; box-shadow: 0 0 0 1px oklch(0.26 0.018 290 / 0.08); padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
      .pcard:hover { box-shadow: 0 0 0 1px var(--primary), var(--shadow); }
      .pname { font-weight: 700; font-size: 15px; }
      .pmeta { font-size: 12.5px; color: var(--muted); }
      .pcontact { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; border-top: 1px dashed var(--border); padding-top: 8px; }
      .pcontact span { display: flex; gap: 6px; align-items: center; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* profile */
      .pgridA { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 20px; align-items: start; }
      .phead { display: flex; gap: 18px; align-items: center; }
      .sec-h { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .sec-h h2 { flex: 0 0 auto; }
      .sec-note { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin: -4px 0 10px; }
      .removal { font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 10px; margin-bottom: 10px; display: inline-flex; gap: 6px; align-items: center; }
      .removal.due { background: var(--warm-soft); color: var(--warm); }
      .removal.gone { background: var(--surface-2); color: var(--muted); }
      .removal.keep { background: var(--surface-2); color: var(--muted); }
      .removal.hold { background: var(--review-soft); color: var(--review); }
      .hiddenph { border: 1.5px dashed oklch(0.55 0.165 285 / 0.35); border-radius: 18px; padding: 12px 16px; color: var(--primary-strong); font-size: 12.5px; background: oklch(0.55 0.165 285 / 0.03); }
      .hiddenph b { font-weight: 700; }
      .actions { display: flex; flex-direction: column; gap: 2px; }
      .act { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer; font-weight: 600; border: 0; background: transparent; font: inherit; font-weight: 600; text-align: left; color: var(--text); width: 100%; }
      .act:hover { background: var(--surface-2); }
      .act.dis { color: var(--faint); cursor: not-allowed; }
      .act.dis:hover { background: transparent; }
      .act .why { font-weight: 500; font-size: 11.5px; color: var(--faint); display: block; }
      .act.danger { color: var(--danger); }

      /* edit */
      .esec { scroll-margin-top: 80px; }
      .esec.ro .fgrid { opacity: 0.6; }
      .phone { display: flex; gap: 6px; }
      .phone select { width: 112px; flex-shrink: 0; }
      .phone input { flex: 1; }
      .notice { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--review-soft); color: oklch(0.36 0.09 240); font-size: 13px; }
      .notice b { display: block; margin-bottom: 4px; }
      .clearbtn { align-self: flex-start; margin-top: 4px; padding: 0 4px; }
      .lockline { font-size: 12px; color: var(--muted); display: flex; gap: 5px; align-items: center; margin-top: 4px; }

      /* permission table */
      table.perm td, table.perm th { text-align: center; padding: 7px 6px; }
      table.perm td:first-child, table.perm th:first-child { text-align: left; padding-left: 4px; }
      table.perm select { height: 30px; padding: 0 6px; border-radius: 8px; font-size: 13px; }
      table.perm tr.actrow td:first-child { color: var(--muted); }
      .pill { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px; border-radius: 8px; font-size: 12.5px; font-weight: 600; }
      .pill.none { background: var(--surface-2); color: var(--faint); }
      .pill.read, .pill.allowed { background: var(--review-soft); color: var(--review); }
      .pill.write { background: var(--ok-soft); color: var(--ok); }
      .pill.no { background: var(--surface-2); color: var(--faint); }
      .pill.fixed { box-shadow: inset 0 0 0 1.5px currentColor; }
      .lvl-none { color: var(--faint); }
      .settings { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
      .subnav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 80px; }

      /* dialog */
      .ov { position: fixed; inset: 0; background: oklch(0.2 0.02 290 / 0.4); display: grid; place-items: center; z-index: 50; padding: 20px; }
      .dlg { background: var(--surface); border-radius: 20px; width: 520px; max-width: 100%; max-height: calc(100vh - 40px); overflow: auto; box-shadow: var(--shadow-lg); }
      .dlg.wide { width: 680px; }
      .dlg-h { display: flex; align-items: center; padding: 18px 22px 6px; }
      .dlg-h h3 { flex: 1; }
      .dlg-b { padding: 8px 22px 6px; }
      .dlg-b p { margin: 0 0 10px; }
      .dlg-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 18px; }
      .x { border: 0; background: transparent; font-size: 22px; cursor: pointer; color: var(--muted); }
      .box { border-radius: 12px; background: var(--surface-2); padding: 10px 12px; margin: 10px 0; }
      .box ul { margin: 4px 0 0; padding-left: 18px; }
      .box.warn { background: var(--warm-soft); color: oklch(0.42 0.1 42); }
      .box.danger { background: var(--danger-soft); color: var(--danger); }
      .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 460px; background: var(--surface); box-shadow: var(--shadow-lg); z-index: 50; overflow: auto; padding: 20px 22px; }
      .toast { position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%); background: oklch(0.26 0.018 290); color: white; padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 60; box-shadow: var(--shadow); }
      .spinner { width: 16px; height: 16px; border-radius: 999px; border: 2px solid var(--border-strong); border-top-color: var(--primary); animation: spin 0.8s linear infinite; display: inline-block; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* prototype bar: deliberately not product styling */
      .proto { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: max-content; z-index: 70; display: flex; gap: 10px; align-items: center; background: #111; color: #eee; padding: 8px 12px; border-radius: 14px; box-shadow: 0 10px 30px #0006; font: 12.5px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; max-width: calc(100vw - 20px); flex-wrap: wrap; justify-content: center; }
      .proto select { background: #222; color: #fff; border: 1px solid #444; height: 28px; border-radius: 7px; font: inherit; padding: 0 6px; max-width: 200px; }
      body.shot .proto { display: none; }
      .proto .tag { background: #ffd23f; color: #111; font-weight: 800; padding: 3px 7px; border-radius: 6px; }
      .proto button { background: #222; color: #fff; border: 1px solid #444; border-radius: 7px; height: 28px; padding: 0 8px; font: inherit; cursor: pointer; }
      .proto label { display: flex; align-items: center; gap: 5px; }
      .ann { font: 11.5px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; color: oklch(0.45 0.15 285); background: oklch(0.55 0.165 285 / 0.06); border-left: 3px solid oklch(0.55 0.165 285 / 0.5); padding: 6px 10px; border-radius: 0 8px 8px 0; margin: 8px 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>

              <div class="row wrap" style="gap:4px">${statusChips(r, v)}</div>

      // ---------- profile ----------
      function fieldRows(r, s, v) {

        }
        if (s === "workContact") return row("f_workEmail", r.work.email) + row("f_workPhone", r.work.phone);
        if (s === "job") {
          const j = r.job;
          return (j.legal ? row("f_legal", j.legal) : "") + row("f_number", j.number) + row("f_start", fd(j.start)) + (ext ? "" : row("f_probation", fd(j.probation))) + row("f_leaving", fd(j.leaving)) +
            (ext ? "" : row("f_contract", j.contract ? t("ct_" + (j.contract === "fixed" ? "fixed" : j.contract)) : "") + row("f_wt", j.wt ? t("wt_" + j.wt) : ""));
        }
        if (s === "contact") {
          const c = r.contact;
          const ec = (i) => (c.ec[i].name ? `${c.ec[i].name} · ${c.ec[i].phone}` : "");
          return row("f_pphone", c.phone) + row("f_pemail", c.email) + `<dt>${t("f_ec")} 1</dt><dd>${ec(0) || '<span class="faint">—</span>'}</dd><dt>${t("f_ec")} 2</dt><dd>${ec(1) || '<span class="faint">—</span>'}</dd>`;
        }
        if (s === "personal") {
          const p = r.personal;
          const addr = p.a1 ? [p.a1, p.a2, `${p.postal} ${p.city}`, p.region, cName(p.country)].filter(Boolean).join(", ") : "";
          return row("f_address", addr) + row("f_dob", fd(p.dob));
        }
        return "";
      }
      function lvlChip(m) {
        return m === "write" ? `<span class="chip ok">${t("editable")}</span>` : m === "clear" ? `<span class="chip warm">${t("clearOnly")}</span>` : `<span class="chip">${t("readOnly")}</span>`;
      }
      function sectionCard(r, s, v) {
        const l = level(v, r, s), m = mode(v, r, s);
        if (l === "na") return S.ann ? `<div class="hiddenph"><b>${t("sec_personal")}</b> is not kept for external workers, so the section does not render at all.</div>` : "";
        if (l === "none") return S.ann ? `<div class="hiddenph"><b>${t("sec_" + s)}</b> · ${t("hidden")} for ${v.name} (${[...auds(v, r)].map((a) => t("aud_" + a)).join(" + ")}). In the product this section is simply absent.</div>` : "";
        const rem = removalInfo(r, s);
        const gone = r.removed[s];
        const sensitive = s === "contact" || s === "personal";
        const editBtn = m !== "read" && !gone ? `<button class="btn xs out" onclick="A.go('/person/${r.id}/edit#${s}')">${I.pen} ${m === "clear" ? t("clearOnly") : t("edit")}</button>` : "";
        let body;
        if (gone) body = `<p class="muted small" style="margin:0">The fields of this section were emptied. The rest of the record stays.</p>`;
        else if (s === "photo") {
          const k = avatarKind(r, v);
          body = `<div class="row" style="gap:14px">${avatar(r, v, 64)}<div><div style="font-weight:600">${r.photo != null ? "Profile photo, uploaded" : "No Profile photo"}</div><div class="small muted">Showing: ${k}</div>
            ${m === "write" ? `<div class="row" style="margin-top:8px"><button class="btn xs out" onclick="A.fakeUpload('${r.id}')">${I.cam} Upload</button>${r.photo != null ? `<button class="btn xs ghost" onclick="A.removePhoto('${r.id}')">Remove</button>` : ""}</div>` : ""}
            ${m === "clear" && r.photo != null ? `<div class="row" style="margin-top:8px"><button class="btn xs ghost" onclick="A.removePhoto('${r.id}')">Remove</button></div>` : ""}</div></div>`;
        } else body = `<dl class="fl">${fieldRows(r, s, v)}</dl>`;
        return `<div class="card" id="sec-${s}">
          <div class="sec-h"><h2>${t("sec_" + s)}</h2>${sensitive ? `<span class="faint" title="${t("sensitiveNote")}">${I.lock}</span>` : ""}${lvlChip(m)}<div class="grow"></div>${s !== "photo" ? editBtn : ""}</div>
          ${sensitive && r.id !== v.id ? `<div class="sec-note">${I.eye} Your view of this section is recorded in the read log.</div>` : ""}
          ${rem ? `<div class="removal ${rem.k}">${rem.k === "hold" ? I.pause : I.hist} ${rem.text}</div>` : ""}
          ${body}
          ${S.ann ? `<div class="ann">level=${l}${m === "clear" ? " (lapsed: clear only)" : ""} · granted by ${t("aud_" + (grantedBy(v, r, s) || "colleague"))}</div>` : ""}
        </div>`;
      }
      function recordFacts(r, v) {
        const see = adminMarkers(v) || r.id === v.id;
        const acc = r.account === "bound" ? `Bound${see ? ` · ${r.email}` : ""}` : r.account === "none" ? `${t("noAccount")}${r.invite ? ` · ${t("inviteSent")}` : ""}${see && r.email ? ` · ${r.email}` : ""}` : `<span style="color:var(--danger)">${t("accountDeleted")}</span> · frozen copy`;
        const facts = [
          ["Type", r.type === "external" ? t("external") : "Employee"],
          [level(v, r, "job") === "none" ? "" : "Spell", r.ended ? `${fd(r.start)} to ${fd(r.ended)}` : `since ${fd(r.start)}`],
        ];
        if (adminMarkers(v) || r.id === v.id) facts.push(["Account", r.account === "deleted" && !adminMarkers(v) ? "" : acc]);
        if (r.roles.length) facts.push(["Directory roles", r.roles.map((x) => `<span class="chip p">${x === "hr" ? "HR" : "Leadership"}</span>`).join(" ")]);
        if (r.prevSpell && adminMarkers(v)) facts.push(["Earlier spell", `<a onclick="A.go('/person/${r.prevSpell}')">${fd(P[r.prevSpell].start)} to ${fd(P[r.prevSpell].ended)}</a>`]);

      }
      function actionList(r, v, inline) {

            ? `<button class="btn sm ${opts.danger ? "danger" : "out"} ${opts.dis ? "disabled" : ""}" title="${opts.why || ""}" onclick="${opts.dis ? `A.toast('${opts.why}')` : onclick}">${icon}${label}</button>`

      function actionListBody(r, v, act, items) {
        const anyWrite = SECTIONS.some((s) => ["write", "clear"].includes(mode(v, r, s)));
        if (anyWrite) act(I.pen, t("editProfile"), `A.go('/person/${r.id}/edit')`);

        if (!r.ended && r.account === "deleted" && canAct("invite", v, r)) act(I.send, t("invite"), "", { dis: 1, why: "Account deleted. End this Employment first; the person rejoins on a new one." });
        if (!r.ended && canAct("changeType", v, r)) act(I.swap, t("changeType"), `A.open('type',{id:'${r.id}'})`, lapsed() ? { dis: 1, why: "Needs Enterprise" } : {});
        if (!r.ended && canAct("end", v, r)) act(I.stop, r.type === "external" ? t("endEng") : t("endEmp"), `A.open('end',{id:'${r.id}'})`);
        if (r.prevSpell && (v.owner || v.orgAdmin || v.roles.includes("hr"))) act(I.copy, t("copyPrev"), `A.open('copy',{id:'${r.id}'})`, lapsed() ? { dis: 1, why: "Setting values needs Enterprise" } : {});
        if (isAdmin(v)) act(I.dl, t("exportPerson"), `A.open('export',{id:'${r.id}'})`);
        else if (r.id === v.id && r.account === "bound") act(I.dl, t("exportMine"), `A.open('export',{id:'${r.id}',self:1})`);
        if (v.owner || v.orgAdmin || v.roles.includes("hr")) act(I.hist, t("history"), `A.open('history',{id:'${r.id}'})`);
        if (r.ended && isAdmin(v)) act(I.pause, r.hold ? t("liftHold") : t("setHold"), `A.open('hold',{id:'${r.id}'})`);
        if (isAdmin(v)) act(I.trash, t("erase"), `A.open('erase',{id:'${r.id}'})`, { danger: 1 });
        return items.length ? `<div class="actions">${items.join("")}</div>` : `<p class="small muted" style="margin:0">Nothing to do here for your role.</p>`;
      }
      function copyBanner(r, v) {
        if (!r.prevSpell || !(v.owner || v.orgAdmin || v.roles.includes("hr"))) return "";
        return `<div class="banner p">${I.copy}<div><b>${r.name} worked here before</b> (${fd(P[r.prevSpell].start)} to ${fd(P[r.prevSpell].ended)}). This spell started empty. You can copy the Photo and Personal sections the organization still holds.</div><button class="btn sm" onclick="A.open('copy',{id:'${r.id}'})">${t("copyPrev")}</button></div>`;

        const visTabs = tabs.filter(([k, , secs]) => !secs.length || secs.some((s) => !["none", "na"].includes(level(v, r, s))) || S.ann);
        const cur = visTabs.find((x) => x[0] === S.ptab) || visTabs[0];

      // ---------- edit form ----------

        const inp = (path, val, dis, type = "text", ph = "") => `<input data-f="${path}" type="${type}" value="${val || ""}" placeholder="${ph}" ${dis}>`;
        const clr = (path, val, m) => (m === "clear" && val ? `<button class="btn xs ghost clearbtn" onclick="A.clearField('${r.id}','${path}')">Clear</button>` : "");
        const F = (label, html, extra = "", cls = "") => `<div class="field ${cls}"><label class="f">${label}</label>${html}${extra}</div>`;
        const sel = (path, val, opts, dis) => `<select data-f="${path}" ${dis}><option value="">—</option>${opts.map(([k, l]) => `<option value="${k}" ${k === val ? "selected" : ""}>${l}</option>`).join("")}</select>`;
        const sec = (s, inner) => {

          if (l === "none") return S.ann ? `<div class="hiddenph"><b>${t("sec_" + s)}</b> · ${t("hidden")}. The edit form leaves it out.</div>` : "";
          const dis = m === "write" ? "" : "disabled";

            ${isAdmin(v) || v.roles.includes("hr") || r.id === v.id ? F(t("f_signIn"), inp("email", r.email, nameDis, "email"), bound ? `<div class="lockline">${I.lock} From the account. Colleagues never see it on directory pages.</div>` : `<div class="hint">Optional. Needed to send an invite.</div>`) : ""}

            ${F(t("f_loc"), sel("card.loc", r.card.loc, locOpts, dis), clr("card.loc", r.card.loc, m))}

          ${sec("photo", (dis, m) => `<div class="row" style="gap:14px">${avatar(r, v, 64)}<div>${m === "write" ? `<button class="btn sm out" onclick="A.fakeUpload('${r.id}')">${I.cam} Upload photo</button> ` : ""}${r.photo != null && m !== "read" ? `<button class="btn sm ghost" onclick="A.removePhoto('${r.id}')">Remove</button>` : ""}<div class="hint">Upload only, never copied from the account picture. JPEG, small and full size. Shows on directory pages only.</div></div></div>`)}

          ${sec("job", (dis, m) => `<div class="fgrid">

            ${F(t("f_leaving"), inp("job.leaving", r.job.leaving, dis, "date"), `<div class="hint">Informational. It ends nothing.</div>`)}
            ${ext ? "" : F(t("f_contract"), sel("job.contract", r.job.contract, [["permanent", t("ct_permanent")], ["fixed", t("ct_fixed")], ["apprentice", t("ct_apprentice")], ["intern", t("ct_intern")], ["other", t("ct_other")]], dis))}

      // ---------- directory settings ----------
      function settingsShell(sub, inner) {
        const g = dirGate(); if (g) return g;
        const v = viewer();
        const items = [];
        if (readsTable(v)) items.push(["permissions", t("perms")], ["roles", t("roles")]);
        if (isAdmin(v)) items.push(["retention", t("retention")]);
        if (canAct("manageLists", v)) items.push(["lists", t("lists")]);
        if (isAdmin(v)) items.push(["readlog", t("readLog")]);
        if (readsTable(v)) items.push(["general", t("general")]);
        if (!items.find((x) => x[0] === sub)) return dirHeader("settings") + `<div class="card">Not available for your role.</div>`;
        return dirHeader("settings") + `<div class="settings"><div class="subnav">${items.map(([k, l]) => `<div class="nav ${k === sub ? "on" : ""}" onclick="A.go('/directory/settings/${k}')">${l}</div>`).join("")}</div><div class="stack">${inner()}</div></div>`;
      }
      function cellOptions(row, aud) {
        if (SECTIONS.includes(row)) {
          if (aud === "owner") return { fixed: "write" };
          if (aud === "self" && (row === "card" || row === "job")) return { fixed: "read" };
          if (aud === "self") return ["read", "write"];
          if (aud === "colleague" || aud === "external") return ["none", "read"];
          return ["none", "read", "write"];
        }
        if (!(aud in S.acts[row])) return null;
        if (aud === "owner") return { fixed: "allowed" };
        return ["no", "allowed"];
      }
      function pagePermissions() {
        return settingsShell("permissions", () => {
          const v = viewer();
          const editable = v.owner;
          const rank = (x) => ({ none: 0, read: 1, write: 2, no: 0, allowed: 1 })[x];
          const cell = (row, aud) => {
            const o = cellOptions(row, aud);
            if (o === null) return `<td class="faint">–</td>`;
            if (o.fixed) return `<td><span class="pill ${o.fixed} fixed" title="Fixed: the owner can't change this cell">${I.lock}${t("lv_" + o.fixed)}</span></td>`;
            const cur = (S.perms[row] || S.acts[row])[aud];
            if (!editable) return `<td><span class="pill ${cur}">${t("lv_" + cur)}</span></td>`;
            return `<td><select onchange="A.setPerm('${row}','${aud}',this.value)">${o.map((x) => `<option value="${x}" ${x === cur ? "selected" : ""} ${lapsed() && rank(x) > rank(cur) ? "disabled" : ""}>${t("lv_" + x)}</option>`).join("")}</select></td>`;
          };
          return `<div class="card">
            <div class="card-h"><h2>${t("perms")}</h2>${editable ? "" : `<span class="chip">${t("readOnly")}</span>`}</div>
            <p class="muted small" style="margin:-6px 0 14px">Who reads or writes each section, and who may do each act. When someone holds several audiences, the widest cell wins. Changes apply at once, with no approval step.${lapsed() ? " <b>On Pro you can narrow cells but not widen them.</b>" : ""}</p>
            <div style="overflow-x:auto"><table class="t perm"><thead><tr><th></th>${AUDS.map((a) => `<th>${t("aud_" + a)}</th>`).join("")}</tr></thead><tbody>
              ${SECTIONS.map((s) => `<tr><td><b>${t("sec_" + s)}</b>${s === "contact" || s === "personal" ? ` <span class="faint">${I.lock}</span>` : ""}</td>${AUDS.map((a) => cell(s, a)).join("")}</tr>`).join("")}
              <tr><td colspan="9" style="padding-top:16px" class="small faint">ACTS</td></tr>
              ${ACTS.map((r) => `<tr class="actrow"><td>${t("act_" + r)}</td>${AUDS.map((a) => cell(r, a)).join("")}</tr>`).join("")}
            </tbody></table></div>
            ${ann("Fixed cells are outlined with a lock. Colleague and External worker only offer None or Read. Group admin has no End cell. Try narrowing Card · External worker to None, then switch the viewer to External.")}
          </div>
          <div class="card"><div class="card-h"><h2>Permission history</h2><span class="chip">Owner, org admins, HR</span></div>
            <table class="t"><tbody>${S.permHistory.map((h) => `<tr><td class="small muted" style="white-space:nowrap">${h.at}</td><td>${h.by}</td><td>${h.text}</td></tr>`).join("")}</tbody></table></div>`;
        });
      }
      function pageRoles() {
        return settingsShell("roles", () => {
          const v = viewer();
          const eligible = openPeople().filter((p) => p.account === "bound");
          const block = (role, label, desc) => {

            return `<div class="card"><div class="card-h"><h2>${label}</h2><span class="muted small">${desc}</span></div>

          };
          return `${v.owner ? "" : `<div class="banner p">${I.lock}<div>Only the owner assigns directory roles. You can see who holds them.</div></div>`}

            ${block("leadership", "Leadership", "Reads Card, Photo, Work contact and Job across the organization.")}

        });

      function pageRetention() {
        return settingsShell("retention", () => {
          return `<div class="card"><div class="card-h"><h2>${t("retention")}</h2></div>
            <p class="muted small" style="margin:-6px 0 14px">How long each section is kept after an Employment ends. A change also applies to people who already left. A shorter period removes what is past it at the next nightly run (02:00). A longer one brings nothing back.</p>
            <table class="t"><thead><tr><th>Section</th><th>Kept after the end</th><th>Product default</th></tr></thead><tbody>
            ${SECTIONS.map((s) => `<tr><td><b>${t("sec_" + s)}</b></td><td><select onchange="A.setRet('${s}',this.value)">${PERIODS.map((p) => `<option value="${p}" ${S.ret[s] === p ? "selected" : ""}>${t("per_" + p)}</option>`).join("")}</select></td><td class="muted">${t("per_" + { card: "forever", job: "forever", workContact: "30d", contact: "30d", personal: "3y", photo: "1y" }[s])}</td></tr>`).join("")}
            </tbody></table>

            <div class="card"><div class="card-h"><h2>Retention holds</h2></div>${formerPeople().filter((p) => p.hold).map((p) => `<div class="row">${avatar(p, viewer(), 28)}<a onclick="A.go('/person/${p.id}')">${p.name}</a><span class="small muted">set by ${p.hold.by} on ${fd(p.hold.at)}</span></div>`).join("") || `<p class="muted small">No holds.</p>`}</div>`;

      function pageLists() {
        return settingsShell("lists", () => {

            return `<div class="card"><div class="card-h"><h2>${t(kind)}</h2></div>
              <table class="t"><tbody>${arr.map((d) => { const n = used(d.id); return `<tr><td><b>${d.name}</b>${d.archived ? ` <span class="chip">archived</span>` : ""}${kind === "location" ? ` <span class="small muted">${d.country ? cName(d.country) : "no country"}</span>` : ""}</td><td class="small muted" style="white-space:nowrap">${n} ${n === 1 ? "record" : "records"}</td>
                <td style="text-align:right;white-space:nowrap"><button class="btn xs ghost" onclick="(function(){const x=prompt('Rename','${d.name}');if(x){${kind === "department" ? "DEPTS" : "LOCS"}.find(e=>e.id==='${d.id}').name=x;render()}})()">${t("rename")}</button><button class="btn xs ghost" onclick="${kind === "department" ? "DEPTS" : "LOCS"}.find(e=>e.id==='${d.id}').archived=${!d.archived};render()">${d.archived ? t("restore") : t("archive")}</button>${n === 0 ? `<button class="btn xs danger" onclick="${kind === "department" ? "DEPTS" : "LOCS"}.splice(${kind === "department" ? "DEPTS" : "LOCS"}.findIndex(e=>e.id==='${d.id}'),1);render()">${t("del")}</button>` : ""}</td></tr>`; }).join("")}</tbody></table>
              <div class="row" style="margin-top:12px"><input id="new-${kind}" placeholder="New ${kind}" ${lapsed() ? "disabled" : ""} style="flex:1">${kind === "location" ? `<select id="new-loc-c" ${lapsed() ? "disabled" : ""}><option value="">No country</option>${COUNTRIES.map((c) => `<option value="${c[0]}">${S.lang === "cs" ? c[2] : c[1]}</option>`).join("")}</select>` : ""}<button class="btn sm ${lapsed() ? "disabled" : ""}" onclick="${lapsed() ? "A.toast('Adding needs Enterprise')" : `(function(){const n=document.getElementById('new-${kind}').value.trim();if(!n)return;${kind === "department" ? "DEPTS.push({id:'d'+Date.now(),name:n})" : "LOCS.push({id:'l'+Date.now(),name:n,country:document.getElementById('new-loc-c').value||null})"};render()})()`}">${t("add")}</button></div>
              ${lapsed() ? `<div class="hint">Adding needs Enterprise. Renaming and archiving work on every plan.</div>` : ""}</div>`;
          };
          return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">${listCard("department", DEPTS, "dept")}${listCard("location", LOCS, "loc")}</div>
            ${ann("Delete shows only on unused entries; a used one can only be archived, because the Card is kept until erased. A Location's country only seeds the phone picker; it never drives holidays or attendance.")}`;
        });
      }

            <div class="filters"><select onchange="S.f.lp=this.value;render()"><option value="">Every person</option>${ppl.map((p) => `<option ${p === fp ? "selected" : ""}>${p}</option>`).join("")}</select><select onchange="S.f.lr=this.value;render()"><option value="">Every reader</option>${rdr.map((p) => `<option ${p === fr ? "selected" : ""}>${p}</option>`).join("")}</select></div>

        else dirCard = `<p style="margin:0 0 6px"><span class="chip ok">On</span> since ${fd("2026-09-02")}</p><p class="small muted" style="margin:0 0 12px">Agreement version ${S.agreement.v}, accepted by ${S.agreement.by} on ${fd(S.agreement.at)}.</p>
          ${S.agreementV2 && owner ? `<div class="banner rev" style="margin-bottom:10px">${I.book}<div>Version 2 of the agreement is ready. Nothing is paused.</div><button class="btn sm" onclick="A.open('agreement',{v:2})">Review</button></div>` : ""}
          ${owner ? `<div class="row wrap"><button class="btn sm out" onclick="A.open('turnoff')">Turn off</button><button class="btn sm danger" onclick="A.open('deldir')">Delete all directory data</button>${S.agreementV2 ? "" : `<button class="btn xs ghost" onclick="S.agreementV2=true;render()" title="Prototype only">simulate agreement v2</button>`}</div>` : `<div class="hint">Only the owner can turn it off or delete its data.</div>`}`;
        const exp = S.orgExport;
        return `<h1>${t("organization")}</h1><p class="muted" style="margin:4px 0 20px">The payer your groups belong to, and who runs it.</p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div class="card"><div class="card-h">${I.building}<h2>Details</h2></div><label class="f">Organization name</label><input value="${ORG}" style="width:100%" disabled></div>
            <div class="card"><div class="card-h">${I.pay}<h2>Plan</h2></div><p style="margin:0">${ORG} · ${S.plan === "ent" ? "Enterprise" : S.plan === "lapsed" ? "Pro (was Enterprise)" : "Pro"}</p></div>
            <div class="card"><div class="card-h">${I.book}<h2>People directory</h2></div>${dirCard}</div>
            ${owner ? `<div class="card"><div class="card-h">${I.dl}<h2>Organization export</h2></div><p class="muted small" style="margin:0 0 12px">Everything the organization holds: one folder per person plus groups, memberships, settings and group events. ZIP, kept 7 days.</p>
              ${!exp ? `<button class="btn sm out" onclick="S.orgExport={state:'prep'};render();setTimeout(()=>{S.orgExport={state:'ready',until:'${plus7()}'};render()},1500)">${I.dl} Export everything</button>` : exp.state === "prep" ? `<span class="spinner"></span> Preparing…` : `<button class="btn sm" onclick="A.toast('Link re-signed. Download starts.')">${I.dl} Download</button> <span class="small muted">until ${fd(exp.until)}</span>`}</div>` : ""}
          </div>
          ${!S.enabled || S.plan === "none" ? `<div class="card" style="margin-top:16px"><div class="card-h">${I.users}<h2>People</h2></div><p class="muted small" style="margin:-6px 0 8px">Without the directory, the person export sits here.</p>
            <table class="t"><tbody>${openPeople().slice(0, 4).map((p) => `<tr><td>${p.name}</td><td class="small muted">${p.email}</td><td style="text-align:right">${isAdmin(v) ? `<button class="btn xs out" onclick="A.open('export',{id:'${p.id}'})">${I.dl} Export</button>` : ""}</td></tr>`).join("")}</tbody></table></div>` : ""}
          ${owner ? `<div class="card" style="margin-top:16px;box-shadow:0 0 0 1px var(--danger-soft)"><div class="card-h"><h2 style="color:var(--danger)">Delete organization</h2></div><button class="btn sm danger" onclick="A.open('delorg')">${I.trash} Delete ${ORG}</button></div>` : ""}
          ${ann("The enable switch, agreement, turn-off, delete-all and organization export live on the existing Organization page, because the directory's own pages don't exist until it's on. Switch the viewer to Org admin to see the 'only the owner' notes.")}`;
      }

      // ---------- dialogs ----------
      function dlg(title, body, footer, wide) {
        return `<div class="ov" onclick="if(event.target===this)A.close()"><div class="dlg ${wide ? "wide" : ""}"><div class="dlg-h"><h3>${title}</h3><button class="x" onclick="A.close()">×</button></div><div class="dlg-b">${body}</div><div class="dlg-f">${footer}</div></div></div>`;
      }
      const cancelBtn = () => `<button class="btn out" onclick="A.close()">${t("cancel")}</button>`;
      function dialog() {
        const d = S.dialog; if (!d) return "";
        const v = viewer(); const r = d.id ? P[d.id] : null;
        switch (d.kind) {
          case "end": {
            const ext = r.type === "external";
            const fromLeaving = r.job.leaving && r.job.leaving <= TODAY;
            const date = fromLeaving ? r.job.leaving : TODAY;
            const reports = openPeople().filter((p) => p.card.reportsTo === r.id);
            const atEnd = SECTIONS.filter((s) => S.ret[s] === "end");
            const blocked = r.manages.length > 0;
            return dlg(`${ext ? t("endEng") : t("endEmp")} · ${r.name}`,
              `<label class="f">Last day</label><input type="date" id="enddate" value="${date}" max="${TODAY}">
              <div class="hint">${fromLeaving ? `Filled in from the Leaving date (${fd(r.job.leaving)}).` : "Today or earlier. A future leaving date is a Job field, not a scheduled end."}</div>
              ${reports.length ? `<div class="box warn"><b>Reports to is cleared on ${reports.length} ${reports.length === 1 ? "record" : "records"}:</b><ul>${reports.map((p) => `<li>${p.name}</li>`).join("")}</ul></div>` : ""}
              <div class="box"><b>Ending also:</b><ul><li>removes them from every group${r.groups.length ? ` (${r.groups.join(", ")})` : ""}</li><li>cancels their pending and future bookings</li>${r.orgAdmin ? "<li>drops their org admin row</li>" : ""}${r.roles.length ? `<li>ends their directory roles (${r.roles.join(", ")})</li>` : ""}${atEnd.length ? `<li>clears ${atEnd.map((s) => t("sec_" + s)).join(", ")} now (retention set to At end)</li>` : ""}<li>moves the record to the Former list, where retention dates start</li></ul><div class="small muted" style="margin-top:6px">${r.account === "bound" ? "Their account stays." : ""}</div></div>
              ${blocked ? `<div class="box danger">${r.name} manages ${r.manages.join(", ")}. Pick another manager for that group first.</div>` : ""}`,
              cancelBtn() + `<button class="btn ${blocked ? "disabled" : ""}" ${blocked ? "" : `onclick="DLG.end('${r.id}')"`}>${ext ? t("endEng") : t("endEmp")}</button>`);
          }
          case "type": {
            const toExt = r.type === "employee";
            const held = [["Contract type", r.job.contract], ["Working time", r.job.wt], ["Probation end date", r.job.probation], ["Personal section (home address, date of birth)", r.personal.a1 || r.personal.dob]];
            return dlg(toExt ? `Change ${r.name} to external worker` : `Change ${r.name} to employee`,
              toExt ? `<p>External workers carry no contract type, working time, probation date or Personal section. Changing the type clears these now:</p><div class="box warn"><ul>${held.map(([l, val]) => `<li>${l}${val ? " · <b>has a value</b>" : " · empty"}</li>`).join("")}</ul></div><p class="small muted">They keep their groups with zero quota. They can't clock in.</p>`
                : `<p>Contract type, working time, probation end date and the Personal section start empty. Fill them in from the edit form.</p>`,
              cancelBtn() + `<button class="btn" onclick="DLG.type('${r.id}')">${toExt ? "Change and clear" : "Change type"}</button>`);
          }
          case "copy": {
            const pr = P[r.prevSpell];
            const opt = (s, label) => {
              if (s === "personal" && r.type === "external") return `<label class="row faint"><input type="checkbox" disabled> ${label} · skipped, the new spell is external</label>`;
              if (pr.removed[s]) return `<label class="row faint"><input type="checkbox" disabled> ${label} · removed by retention on ${fd(pr.removed[s])}</label>`;
              const has = s === "photo" ? pr.photo != null : s === "contact" ? pr.contact.phone || pr.contact.email : pr.personal.a1 || pr.personal.dob;
              if (!has) return `<label class="row faint"><input type="checkbox" disabled> ${label} · nothing held</label>`;
              return `<label class="row"><input type="checkbox" class="cp" value="${s}" checked> ${label} · held, ${t("dueOn", { d: fd(addP(pr.ended, S.ret[s])) }).toLowerCase()}</label>`;
            };
            return dlg(`${t("copyPrev")}`,
              `<p>${r.name}'s earlier spell ran ${fd(pr.start)} to ${fd(pr.ended)}. Copy whole sections into this spell:</p><div class="stack-s">${opt("contact", t("sec_contact"))}${opt("personal", t("sec_personal"))}${opt("photo", t("sec_photo"))}</div><p class="small muted" style="margin-top:12px">Card, Work contact and Job never carry over. Copying overwrites what this spell holds in those sections.</p>`,
              cancelBtn() + `<button class="btn" onclick="DLG.copy('${r.id}')">Copy</button>`);
          }
          case "hold":
            return r.hold
              ? dlg(t("liftHold"), `<p>Held since ${fd(r.hold.at)} by ${r.hold.by}. Lifting it lets the next nightly run remove whatever is past its period.</p>${SECTIONS.map((s) => { const p = S.ret[s]; if (p === "forever" || r.removed[s]) return ""; const due = addP(r.ended, p); return due <= TODAY ? `<div class="box warn small">${t("sec_" + s)} is past its period and goes tonight.</div>` : ""; }).join("")}`, cancelBtn() + `<button class="btn" onclick="DLG.hold('${r.id}')">${t("liftHold")}</button>`)
              : dlg(t("setHold"), `<p>Retention purges skip ${r.name}'s record until someone lifts the hold. Erasure still works. The hold records who set it and when.</p>`, cancelBtn() + `<button class="btn" onclick="DLG.hold('${r.id}')">${t("setHold")}</button>`);
          case "export": {
            const st = S.exports[r.id];
            const spells = PEOPLE.filter((p) => p.email === r.email);
            const body = `<p>${d.self ? "Everything Acme s.r.o. holds about you" : `Everything the organization holds about ${r.name}`}, across ${spells.length} ${spells.length === 1 ? "spell" : "spells"}: profile sections still held, the photo, groups and quotas, bookings with attachments, attendance, the change log, and the dates and purposes of reads.</p>
              <div class="box small">ZIP with <code>person.json</code>, one CSV per list, and files. Built in the background. You get an in-app notification. Nothing goes by email.</div>
              ${st ? (st.state === "ready" ? `<div class="box">${I.dl} <b>Ready.</b> Available until ${fd(st.until)}. Each click signs a fresh link.</div>` : `<div class="box"><span class="spinner"></span> Preparing…</div>`) : ""}`;
            const foot = !st ? cancelBtn() + `<button class="btn" onclick="DLG.exp('${r.id}')">Start export</button>` : st.state === "ready" ? `<button class="btn out" onclick="A.close()">${t("close")}</button><button class="btn" onclick="A.toast('Link re-signed. Download starts.')">${I.dl} Download</button>` : `<button class="btn out" onclick="A.close()">Close, keep preparing</button>`;
            return dlg(d.self ? t("exportMine") : `${t("exportPerson")} · ${r.name}`, body, foot);
          }
          case "erase":
            return dlg(`${t("erase")} · ${r.name}`, `<div class="box danger">This deletes every profile section, the photo and the profile history of ${r.name}, in every spell, now. It can't be undone. Backups expire within 7 days.</div><p class="small">Bookings and attendance are a separate question for <a>T-482</a> and stay in this prototype.</p><label class="f">Type the name to confirm</label><input id="erasename" style="width:100%" placeholder="${r.name}">`, cancelBtn() + `<button class="btn danger" onclick="DLG.erase('${r.id}')">Erase</button>`);
          case "invite":
            return dlg(`${t("invite")} · ${r.name}`, `<label class="f">Email</label><input id="invemail" type="email" value="${r.email}" style="width:100%"><div class="hint">The invite targets this record. Redeeming it binds the account. The sign-up form fills in "${r.name}".</div>
              <label class="f" style="margin-top:12px">Group (optional)</label><select style="width:100%"><option>No group</option><option>Support</option><option>Engineering</option></select>`, cancelBtn() + `<button class="btn" onclick="DLG.invite('${r.id}')">${I.send} ${t("invite")}</button>`);
          case "add":
            return dlg(t("addPerson"), `<div class="fgrid"><div class="field full"><label class="f">${t("f_name")}</label><input id="addname" placeholder="Required"></div>
              <div class="field full"><label class="f">Email</label><input id="addemail" type="email" placeholder="Optional, needed for an invite"></div>
              <div class="field full"><label class="f">Type</label><div class="row"><label class="row"><input type="radio" name="addtype" value="employee" checked> Employee</label><label class="row"><input type="radio" name="addtype" value="external"> ${t("external")}</label></div></div>
              <div class="field full"><label class="row"><input type="checkbox" id="addinv"> Send an invite now</label></div></div>
              <p class="small muted">The person exists only in the directory until they redeem an invite. Nobody books leave or records attendance for them.</p>`, cancelBtn() + `<button class="btn" onclick="DLG.add()">Add</button>`);
          case "retention": {
            const has = (p, s) => ({ card: p.card.title, photo: p.photo != null, workContact: p.work.email || p.work.phone, job: p.job.number || p.job.start, contact: p.contact.phone || p.contact.email || p.contact.ec[0].name, personal: p.personal.a1 || p.personal.dob })[s];
            const n = formerPeople().filter((p) => has(p, d.sec) && !p.hold && !p.removed[d.sec] && addP(p.ended, d.val) <= TODAY && (S.ret[d.sec] === "forever" || addP(p.ended, S.ret[d.sec]) > TODAY)).length;
            return dlg(`Shorten ${t("sec_" + d.sec)}?`, `<p>From ${t("per_" + S.ret[d.sec])} to ${t("per_" + d.val)}.</p><div class="box ${n ? "warn" : ""}">${n ? `<b>The next nightly run removes ${t("sec_" + d.sec)} for ${n} ${n === 1 ? "person" : "people"}.</b> Records on hold are skipped.` : "Nobody's data is past the new period yet."}</div><p class="small muted">Lengthening it again later brings nothing back.</p>`,
              cancelBtn() + `<button class="btn" onclick="S.ret['${d.sec}']='${d.val}';A.close();A.toast('Retention saved')">Shorten</button>`);
          }
          case "agreement":
            return dlg(`People directory agreement · version ${d.v}`, `<div class="box" style="height:170px;overflow:auto;font-size:13px">(The owner's legal text goes here: Flexi Day processes directory data on ${ORG}'s instructions, no biometric processing of photos, sub-processors, retention, return and deletion at the end of service…)</div>
              <label class="row" style="margin-top:12px"><input type="checkbox" id="agree" onchange="document.getElementById('agreeBtn').disabled=!this.checked"> I accept this agreement for ${ORG}</label>
              <p class="small muted">We record who accepted, when, and which version.</p>`, cancelBtn() + `<button class="btn" id="agreeBtn" disabled onclick="DLG.agree(${d.v})">${S.enabled ? "Accept" : "Accept and turn on"}</button>`, true);
          case "turnoff":
            return dlg("Turn the directory off?", `<p>The directory pages disappear for everyone. Profiles stay stored, retention purges keep running and the organization export still works.</p><p class="small muted">Deleting all directory data is a separate action.${lapsed() ? " <b>While lapsed, you can't turn it back on.</b>" : ""}</p>`, cancelBtn() + `<button class="btn" onclick="S.enabled=false;A.go('/organization');A.toast('Directory off. Data kept.')">Turn off</button>`);
          case "deldir":
            return dlg("Delete all directory data?", `<div class="box danger">Deletes every profile, photo, department and location list, permission table and read log of ${ORG}. Employments, bookings and attendance stay.</div><label class="f">Type ${ORG} to confirm</label><input style="width:100%">`, cancelBtn() + `<button class="btn danger" onclick="A.close();A.toast('Prototype: nothing deleted')">Delete</button>`);
          case "delorg":
            return dlg(`Delete ${ORG}?`, `<div class="box danger">Deletes the organization, every group, booking, attendance record and profile.</div><p>Want a copy first? <a onclick="A.close();A.go('/organization');setTimeout(()=>document.querySelector('.card .btn.out')&&0,0)">Export organization data</a>. Deleting doesn't wait for the export, and it removes any export still stored.</p><label class="f">Type ${ORG} to confirm</label><input style="width:100%">`, cancelBtn() + `<button class="btn danger" onclick="A.close();A.toast('Prototype: nothing deleted')">Delete organization</button>`);
          case "history": {
            const rows = S.profileHistory[r.id] || [];
            return `<div class="ov" onclick="if(event.target===this)A.close()"><div class="drawer"><div class="row"><h3 class="grow">${t("history")} · ${r.name}</h3><button class="x" onclick="A.close()">×</button></div>
              <p class="small muted">Who changed which fields, when, and through which audience. Never the values.</p>
              ${rows.length ? `<table class="t"><tbody>${rows.map((h) => `<tr><td class="small muted" style="white-space:nowrap;vertical-align:top">${h.at}</td><td><b>${h.by === "retention" ? `<span class="chip">retention</span>` : h.by}</b>${h.via ? ` <span class="small muted">as ${h.via}</span>` : ""}<div class="small">${h.sec}: ${h.fields}</div></td></tr>`).join("")}</tbody></table>` : `<p class="muted">No changes yet.</p>`}</div></div>`;
          }
        }
        return "";
      }
      const DLG = {
        end(id) {
          const r = P[id]; const date = document.getElementById("enddate").value || TODAY;
          r.ended = date;
          openPeople().forEach((p) => { if (p.card.reportsTo === id) p.card.reportsTo = ""; });
          r.roles = []; r.orgAdmin = false; r.groups = [];
          SECTIONS.filter((s) => S.ret[s] === "end").forEach((s) => (r.removed[s] = date));
          A.go("/person/" + id); A.toast("Ended. The record moved to the Former list.");
        },
        type(id) {
          const r = P[id];
          if (r.type === "employee") { r.type = "external"; r.job.contract = ""; r.job.wt = ""; r.job.probation = ""; r.personal = PE(); }
          else r.type = "employee";
          A.close(); A.toast("Type changed");
        },
        copy(id) {
          const r = P[id], pr = P[r.prevSpell];
          document.querySelectorAll(".cp:checked").forEach((el) => {
            const s = el.value;
            if (s === "photo") r.photo = pr.photo;
            if (s === "personal") r.personal = { ...pr.personal };
            if (s === "contact") r.contact = JSON.parse(JSON.stringify(pr.contact));
          });
          A.close(); A.toast("Copied into this spell");
        },
        hold(id) { const r = P[id]; r.hold = r.hold ? null : { by: viewer().name, at: TODAY }; A.close(); A.toast(r.hold ? "Hold set" : "Hold lifted"); },
        exp(id) {
          S.exports[id] = { state: "prep" }; render();
          S.readLog.unshift({ at: TODAY + " " + nowTime(), reader: viewer().name, person: P[id].name, secs: "all held sections", aud: t("aud_" + (viewer().owner ? "owner" : viewer().orgAdmin ? "orgAdmin" : "self")), kind: "export" });
          setTimeout(() => { S.exports[id] = { state: "ready", until: plus7() }; render(); }, 1500);
        },
        erase(id) { const r = P[id]; if (document.getElementById("erasename").value.trim() !== r.name) { A.toast("Type the exact name"); return; } r.erased = true; A.go(r.ended ? "/directory/former" : "/directory"); A.toast("Erased"); },
        invite(id) { P[id].invite = "sent"; P[id].email = document.getElementById("invemail").value; A.close(); A.toast("Invite sent"); },
        add() {
          const name = document.getElementById("addname").value.trim(); if (!name) { A.toast("A name is required"); return; }
          const id = "n" + Date.now();
          const p = person({ id, name, email: document.getElementById("addemail").value.trim(), account: "none", start: TODAY, type: document.querySelector('[name="addtype"]:checked').value, card: { title: "", dept: "", loc: "", reportsTo: "" } });
          if (document.getElementById("addinv").checked && p.email) p.invite = "sent";
          PEOPLE.push(p); P[id] = p; A.go("/person/" + id + "/edit"); A.toast("Added. Fill in the rest.");
        },
        agree(v) { S.agreement = { v, by: viewer().name, at: TODAY }; S.enabled = true; S.agreementV2 = false; A.close(); A.toast(`Agreement version ${v} accepted`); },
      };

      // ---------- prototype bar ----------
      function pageVariantKey() {
        if (S.route === "/directory") return "dv";
        if (/^\/person\/[^/]+$/.test(S.route)) return "pv";
        return null;
      }
      const VNAMES = { dv: { A: "Cards", B: "Table" }, pv: { A: "One page + rail", B: "Header + tabs" } };
      function protoBar() {
        const vk = pageVariantKey();
        const jumps = [
          ["/directory", "Directory"], ["/directory/former", "Former list"], ["/person/eva", "Profile · Eva (full)"], ["/person/eva/edit", "Edit · Eva"],
          ["/person/hana", "Profile · Hana (rejoined)"], ["/person/jonas", "Profile · Jonas (external)"], ["/person/petra", "Profile · Petra (no account)"],
          ["/person/karel", "Profile · Karel (account deleted)"], ["/person/ondrej", "Profile · Ondřej (former)"], ["/person/filip", "Profile · Filip (former, hold)"], ["/person/veronika", "Profile · Veronika (purged)"],
          ["/directory/settings/permissions", "Permission table"], ["/directory/settings/roles", "Directory roles"], ["/directory/settings/retention", "Retention"],
          ["/directory/settings/lists", "Departments & locations"], ["/directory/settings/readlog", "Read log"], ["/directory/settings/general", "General (notice)"], ["/organization", "Organization (enable, export)"],
        ];
        return `<div class="proto"><span class="tag">PROTOTYPE</span>
          <label>viewer <select onchange="A.set('role',this.value)">${Object.entries(VIEWERS).map(([k, id]) => `<option value="${k}" ${S.role === k ? "selected" : ""}>${D.en["aud_" + k]} · ${P[id].name}</option>`).join("")}</select></label>
          <label>plan <select onchange="A.set('plan',this.value)"><option value="ent" ${S.plan === "ent" ? "selected" : ""}>Enterprise</option><option value="lapsed" ${S.plan === "lapsed" ? "selected" : ""}>Pro, lapsed (holds data)</option><option value="none" ${S.plan === "none" ? "selected" : ""}>Pro, never had it</option></select></label>
          <label>go <select onchange="A.go(this.value)"><option value="">jump to…</option>${jumps.map(([p, l]) => `<option value="${p}">${l}</option>`).join("")}</select></label>
          ${vk ? `<button onclick="A.variant(-1)">←</button><span>${S[vk]} · ${VNAMES[vk][S[vk]]}</span><button onclick="A.variant(1)">→</button>` : ""}
          <label><input type="checkbox" ${S.ann ? "checked" : ""} onchange="A.set('ann',this.checked)"> notes</label>
        </div>`;
      }

      // ---------- render ----------
      function page() {
        const r = S.route.split("/").filter(Boolean);
        if (r[0] === "organization") return pageOrganization();
        if (r[0] === "person") return r[2] === "edit" ? pageEdit(r[1]) : pageProfile(r[1]);
        if (r[0] === "directory" && r[1] === "former") return pageFormer();
        if (r[0] === "directory" && r[1] === "settings") {
          return { permissions: pagePermissions, roles: pageRoles, retention: pageRetention, lists: pageLists, readlog: pageReadLog, general: pageGeneral }[r[2]]?.() ?? pagePermissions();
        }
        return pageDirectory();
      }
      function render() {
        const ae = document.activeElement;
        const focusId = ae && ae.id;
        const sel = ae && "selectionStart" in ae ? ae.selectionStart : null;
        document.getElementById("app").innerHTML = shell(page()) + dialog() + protoBar() + (S.toast ? `<div class="toast">${S.toast}</div>` : "");
        if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); if (sel != null && el.setSelectionRange) try { el.setSelectionRange(sel, sel); } catch (e) {} } }
      }
      document.addEventListener("keydown", (e) => {
        if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
        if (e.key === "ArrowLeft") A.variant(-1);
        if (e.key === "ArrowRight") A.variant(1);
        if (e.key === "Escape") A.close();
      });
      window.addEventListener("popstate", () => { parseHash(); render(); });
      parseHash();
      logReadIfNeeded();
      render();
    </script>
  </body>
</html>
